{% extends "base.html" %}
{% block titulo %}Nueva lectura{% endblock %}

{% block contenido %}
<h1>Registrar nueva lectura</h1>

<form method="post" class="formulario">
  <label>Fecha
    <input name="fecha" type="date" value="{{ hoy }}" required>
  </label>
  <label>Hora
    <input name="hora" type="time" required>
  </label>
  <label>Lote (XXXXX-XX)
    <input name="lote" placeholder="25254-01" pattern="[0-9]{5}-[0-9]{2}"
           title="5 dígitos, un guion y 2 dígitos. Ej: 25254-01" required>
  </label>
  <label>pH (X.XX)
    <input name="ph" type="number" step="0.01" min="0" max="14" required>
  </label>
  <label>TDS (XXX)
    <input name="tds" type="number" min="0" max="999" required>
  </label>
  <label>Técnico
    <input name="tecnico" maxlength="100" required>
  </label>

  <fieldset>
    <legend>Pruebas cualitativas (marcada = cumple)</legend>
    <label class="check"><input type="checkbox" name="sabor" checked> Sabor</label>
    <label class="check"><input type="checkbox" name="olor" checked> Olor</label>
    <label class="check"><input type="checkbox" name="color" checked> Color</label>
    <label class="check"><input type="checkbox" name="sello" checked> Verificación de sello</label>
  </fieldset>

  <label class="ancho">Observaciones
    <textarea name="observaciones" rows="3"></textarea>
  </label>

  <div class="acciones">
    <button class="boton">Guardar lectura</button>
    <a href="{{ url_for('listar_lecturas') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
