{% extends "base.html" %}
{% block titulo %}Editar lectura{% endblock %}

{% block contenido %}
<h1>Editar lectura #{{ l.id }}</h1>

<form method="post" action="{{ url_for('editar', id=l.id) }}" class="formulario">
    <label>Fecha
        <input name="fecha" type="date" value="{{ l.fecha.isoformat() }}" required>
    </label>

    <label>Hora
        <input name="hora" type="time" value="{{ l.hora.strftime('%H:%M') }}" required>
    </label>

    <label>Lote (XXXXX-XX)
        <input name="lote" placeholder="25254-01" pattern="[0-9]{5}-[0-9]{2}" title="5 dígitos, un guion y 2 dígitos. Ej:25254-01" value="{{ l.lote_rel.numero }}" required>
    </label>

    <label>pH (X.XX)
        <input name="ph" type="number" step="0.01" min="0" max="14" value="{{ '%.2f'|format(l.ph) }}" required>
    </label>

    <label>TDS (XXX)
        <input name="tds" type="number" min="0" max="999" value="{{ l.tds }}" required>
    </label>
    
    <label>Técnico
        <input name="tecnico" maxlength="100" value="{{ l.tecnico }}" required>
    </label>

    <fieldset>
        <legend>Pruebas cualitativas (marcada = cumple)</legend>
        <label class="check"><input type="checkbox" name="sabor" {{ 'checked' if l.sabor }}> Sabor</label>
        <label class="check"><input type="checkbox" name="olor" {{ 'checked' if l.olor }}> Olor</label>
        <label class="check"><input type="checkbox" name="color" {{ 'checked' if l.color }}> Color</label>
        <label class="check"><input type="checkbox" name="sello" {{ 'checked' if l.sello }}> Verificación de sello</label>
    </fieldset>

    <label class="ancho">Observaciones
        <textarea name="observaciones" rows="3">{{ l.observaciones or '' }}</textarea>
    </label>

    <div class="acciones">
        <button class="boton">Guardar cambios</button>
        <a href="{{ url_for('listar_lecturas') }}">Cancelar</a>
    </div>
</form>
{% endblock %}
