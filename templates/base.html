<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Calidashboard{% endblock %} · Calidashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
  <header class="barra">
    <div class="marca">💧 Calidashboard <span>Agua producto</span></div>
    <nav>
      <a href="{{ url_for('listar_lecturas') }}">Lecturas</a>
      <a href="{{ url_for('ver_alertas') }}">Alertas</a>
      <a href="{{ url_for('resumen') }}">Resumen</a>
      <a href="{{ url_for('nueva_lectura') }}" class="boton">+ Nueva lectura</a>  
    </nav>
  </header>

  <main>
    {% block contenido %}{% endblock %}
  </main>

  <footer>Sistema de práctica · Semana 8 · Fundamentos de Programación</footer>
</body>
</html>
